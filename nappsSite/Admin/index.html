<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAPPS Executive Command OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #030a08;
            --surface: #0a1210;
            --primary: #062117;
            --gold: #c5a028;
            --gold-glow: rgba(197, 160, 40, 0.3);
            --white: #ffffff;
            --text-dim: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--white); min-height: 100vh; overflow: hidden; }

        /* --- GATEKEEPER & KEYPAD --- */
        #gatekeeper {
            position: fixed; inset: 0; background: radial-gradient(circle at top right, #0a3525, #030a08);
            z-index: 9999; display: flex; align-items: center; justify-content: center;
            transition: all 0.8s cubic-bezier(0.85, 0, 0.15, 1);
        }
        .pin-container {
            background: rgba(10, 18, 16, 0.8); backdrop-filter: blur(40px);
            padding: 40px; border-radius: 32px; border: 1px solid var(--glass-border);
            text-align: center; width: 100%; max-width: 400px;
        }
        .pin-display { display: flex; gap: 15px; justify-content: center; margin: 25px 0; }
        .pin-dot { width: 15px; height: 15px; border-radius: 50%; border: 2px solid var(--gold); transition: 0.3s; }
        .pin-dot.active { background: var(--gold); box-shadow: 0 0 15px var(--gold); }
        
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
        .key { 
            padding: 15px; background: rgba(255,255,255,0.03); border-radius: 12px; 
            cursor: pointer; transition: 0.2s; border: 1px solid transparent; color: var(--text-dim);
        }
        .key:hover { background: rgba(197, 160, 40, 0.1); color: var(--gold); border-color: var(--gold-glow); }
        .key:active { transform: scale(0.9); background: var(--gold); color: var(--primary); }

        /* --- LAYOUT --- */
        #app { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
        nav.side-bar {
            background: var(--surface); border-right: 1px solid var(--glass-border);
            padding: 40px 20px; display: flex; flex-direction: column; gap: 8px;
        }
        .nav-item {
            padding: 14px 20px; border-radius: 12px; color: var(--text-dim);
            display: flex; align-items: center; gap: 15px; transition: 0.3s; cursor: pointer;
        }
        .nav-item.active { background: var(--primary); color: var(--gold); border: 1px solid var(--glass-border); }
        
        main { padding: 40px 5%; overflow-y: auto; height: 100vh; }
        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px; }
        .stat-widget { 
            background: var(--surface); padding: 25px; border-radius: 20px; 
            border: 1px solid var(--glass-border); 
        }

        /* --- CARDS --- */
        .exec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .exec-card { 
            background: var(--surface); border-radius: 20px; border: 1px solid var(--glass-border); 
            transition: 0.3s; overflow: hidden;
        }
        .exec-card:hover { border-color: var(--gold); transform: translateY(-3px); }
        .status-pill { padding: 4px 10px; border-radius: 50px; font-size: 0.6rem; font-weight: 800; }

        .btn-action { 
            background: var(--white); color: var(--bg); padding: 10px 20px; 
            border-radius: 10px; border: none; font-weight: 700; cursor: pointer; font-size: 0.75rem;
        }
        .system-drawer {
            position: fixed; right: 0; top: 0; height: 100%; width: 400px;
            background: var(--surface); border-left: 1px solid var(--glass-border);
            transform: translateX(100%); transition: 0.5s cubic-bezier(0.85, 0, 0.15, 1);
            z-index: 1000; padding: 40px;
        }
        .system-drawer.open { transform: translateX(0); }
        .loading-bar { position: fixed; top: 0; left: 0; height: 3px; background: var(--gold); width: 0; transition: 0.4s; z-index: 10001; }
    </style>
</head>
<body>

<div class="loading-bar" id="loadBar"></div>

<div id="gatekeeper">
    <div class="pin-container">
        <div style="width:60px; height:60px; background:var(--primary); border-radius:15px; display:flex; align-items:center; justify-content:center; margin: 0 auto 20px; border:1px solid var(--gold);">
            <i class="fas fa-shield-halved" style="color:var(--gold)"></i>
        </div>
        <h2 style="font-family:'Cormorant Garamond'; color:white;">Executive Access</h2>
        <div class="pin-display">
            <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
        </div>
        <input type="password" id="actualPin" maxlength="4" style="position:absolute; opacity:0; pointer-events:none;">
        <div class="keypad">
            <div class="key" onclick="pressKey('1')">1</div><div class="key" onclick="pressKey('2')">2</div><div class="key" onclick="pressKey('3')">3</div>
            <div class="key" onclick="pressKey('4')">4</div><div class="key" onclick="pressKey('5')">5</div><div class="key" onclick="pressKey('6')">6</div>
            <div class="key" onclick="pressKey('7')">7</div><div class="key" onclick="pressKey('8')">8</div><div class="key" onclick="pressKey('9')">9</div>
            <div></div><div class="key" onclick="pressKey('0')">0</div><div class="key" onclick="pressKey('back')"><i class="fas fa-backspace"></i></div>
        </div>
    </div>
</div>

<div id="app" style="display:none;">
    <nav class="side-bar">
        <div style="margin-bottom: 40px; padding: 0 15px;">
            <h2 style="font-family: 'Cormorant Garamond'; color: var(--gold); font-size: 1.8rem;">NAPPS OS</h2>
            <p style="font-size: 0.6rem; letter-spacing: 2px; color: var(--text-dim);">OGUN STATE COMMAND</p>
        </div>
        <div class="nav-item active" onclick="switchNav('schools')"><i class="fas fa-university"></i> Schools</div>
        <div class="nav-item" onclick="switchNav('teachers')"><i class="fas fa-user-graduate"></i> Teachers</div>
        <div class="nav-item" onclick="switchNav('executives')"><i class="fas fa-crown"></i> Council</div>
        <div class="nav-item" onclick="switchNav('revenue')"><i class="fas fa-chart-line"></i> Revenue</div>
        <div style="margin-top:auto" class="nav-item" onclick="location.reload()"><i class="fas fa-power-off"></i> Logout</div>
    </nav>

    <main>
        <div class="top-bar">
            <div>
                <h1 id="viewTitle" style="font-family:'Cormorant Garamond'; font-size: 2.2rem;">Institutional Registry</h1>
                <p id="viewSubtitle" style="color:var(--text-dim); font-size: 0.8rem;">Managing official school records</p>
            </div>
            <button class="btn-action" style="background:var(--gold); color:var(--primary)" onclick="toggleDrawer(true)">+ NEW ENTRY</button>
        </div>

        <div class="stats-row">
            <div class="stat-widget">
                <p style="font-size:0.6rem; color:var(--text-dim); font-weight:800;">TOTAL REVENUE</p>
                <div class="stat-value" id="revVal" style="font-size:2rem; font-family:'Cormorant Garamond'; color:var(--gold);">₦0.00</div>
            </div>
            <div class="stat-widget">
                <p style="font-size:0.6rem; color:var(--text-dim); font-weight:800;">SCHOOLS</p>
                <div class="stat-value" id="schoolVal" style="font-size:2rem; font-family:'Cormorant Garamond';">0</div>
            </div>
            <div class="stat-widget">
                <p style="font-size:0.6rem; color:var(--text-dim); font-weight:800;">TEACHERS</p>
                <div class="stat-value" id="teacherVal" style="font-size:2rem; font-family:'Cormorant Garamond';">0</div>
            </div>
        </div>

        <div class="exec-grid" id="grid-container"></div>
    </main>

    <div class="system-drawer" id="sysDrawer">
        <h2 style="font-family:'Cormorant Garamond'; margin-bottom:30px;">Manual Registration</h2>
        <form id="addForm" style="display:flex; flex-direction:column; gap:15px;">
            <select id="fType" style="padding:12px; background:var(--bg); border:1px solid var(--glass-border); color:white; border-radius:8px;">
                <option value="schools">School</option>
                <option value="teachers">Teacher</option>
                <option value="executives">Council Member</option>
            </select>
            <input type="text" id="fName" placeholder="Name" required style="padding:12px; background:var(--bg); border:1px solid var(--glass-border); color:white; border-radius:8px;">
            <input type="text" id="fDetail" placeholder="Location/Role" required style="padding:12px; background:var(--bg); border:1px solid var(--glass-border); color:white; border-radius:8px;">
            <input type="text" id="fPhone" placeholder="Phone" required style="padding:12px; background:var(--bg); border:1px solid var(--glass-border); color:white; border-radius:8px;">
            <button type="submit" class="btn-action" style="background:var(--gold); color:var(--primary); padding:15px; margin-top:10px;">AUTHORIZE & SYNC</button>
            <button type="button" onclick="toggleDrawer(false)" style="background:transparent; color:var(--text-dim); border:none; cursor:pointer;">Cancel</button>
        </form>
    </div>
</div>

<script src="js/admin-board.js"></script>
</body>
</html>
