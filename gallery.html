<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAPPS Ogun | Official Member Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #062117; --gold: #d4af37; --bg: #fdfbf7; --white: #ffffff; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--primary); scroll-behavior: smooth; }

        /* HERO & NAVIGATION */
        .hero { background: var(--primary); color: white; padding: 100px 6% 80px; text-align: center; position: relative; }
        .hero h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(2.5rem, 5vw, 4rem); margin-bottom: 15px; }
        .hero p { opacity: 0.8; font-size: 1.1rem; max-width: 700px; margin: 0 auto 40px; }
        
        /* SEARCH BAR */
        .search-container { max-width: 700px; margin: 0 auto; position: relative; }
        .search-container i { position: absolute; left: 25px; top: 50%; transform: translateY(-50%); color: #999; }
        .search-container input { 
            width: 100%; padding: 22px 22px 22px 60px; border-radius: 60px; border: none; 
            font-size: 1.1rem; box-shadow: 0 15px 45px rgba(0,0,0,0.3); outline: none; 
        }

        /* STATUS TRACKER FLOATING BUTTON */
        .status-trigger-wrap { margin-top: -30px; text-align: center; position: relative; z-index: 100; }
        .btn-track { 
            background: var(--gold); color: var(--primary); border: none; padding: 15px 35px; 
            border-radius: 50px; font-weight: 800; font-size: 0.8rem; cursor: pointer; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.2); transition: 0.3s; letter-spacing: 1px;
        }
        .btn-track:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0,0,0,0.3); }

        /* GRID SYSTEM */
        .container { padding: 60px 6%; max-width: 1400px; margin: auto; }
        .section-header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin: 60px 0 30px; border-bottom: 2px solid #eee; padding-bottom: 15px; 
        }
        .section-header h2 { font-family: 'Cormorant Garamond'; font-size: 2.2rem; }
        .counter { background: var(--primary); color: var(--gold); padding: 4px 15px; border-radius: 20px; font-size: 0.7rem; font-weight: 800; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 35px; }

        /* CARD DESIGN */
        .card { 
            background: var(--white); border: 1px solid #eee; border-radius: 8px; 
            overflow: hidden; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            opacity: 0; transform: translateY(30px); display: flex; flex-direction: column;
        }
        .card.reveal { opacity: 1; transform: translateY(0); }
        .card:hover { transform: translateY(-10px); border-color: var(--gold); box-shadow: 0 20px 50px rgba(0,0,0,0.1); }

        .card-img { height: 220px; position: relative; }
        .card-img img { width: 100%; height: 100%; object-fit: cover; }
        .badge { 
            position: absolute; top: 15px; left: 15px; background: var(--primary); 
            color: var(--gold); padding: 6px 14px; font-size: 0.65rem; font-weight: 800; 
            border-radius: 4px; display: flex; align-items: center; gap: 6px;
        }

        .card-body { padding: 25px; flex-grow: 1; }
        .card-body h3 { font-family: 'Cormorant Garamond'; font-size: 1.8rem; margin-bottom: 10px; color: var(--primary); }
        .meta-info { color: var(--gold); font-size: 0.8rem; font-weight: 700; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .card-body p { font-size: 0.85rem; color: #666; line-height: 1.6; }

        .btn-contact { 
            display: block; width: 100%; padding: 18px; background: var(--primary); 
            color: var(--gold); text-align: center; text-decoration: none; 
            font-weight: 800; font-size: 0.75rem; text-transform: uppercase; transition: 0.3s;
        }
        .btn-contact:hover { background: var(--gold); color: var(--primary); }

        /* MODAL SYSTEM */
        #modalOverlay { 
            display: none; position: fixed; inset: 0; background: rgba(6,33,23,0.98); 
            z-index: 2000; align-items: center; justify-content: center; padding: 20px; 
            backdrop-filter: blur(10px);
        }
        .modal-card { 
            background: white; width: 100%; max-width: 450px; padding: 50px 40px; 
            border-radius: 12px; text-align: center; position: relative; 
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
        }
        .close-btn { position: absolute; top: 20px; right: 20px; font-size: 1.5rem; cursor: pointer; border: none; background: none; color: #ccc; }
        .modal-input { 
            width: 100%; padding: 18px; border: 2px solid #eee; border-radius: 8px; 
            margin: 25px 0 15px; text-align: center; font-size: 1.2rem; font-weight: 600; outline: none;
        }
        .modal-input:focus { border-color: var(--gold); }

        #statusResult { margin-top: 30px; padding: 25px; background: #fdfbf7; border-radius: 8px; display: none; border: 1px dashed #ddd; }

        /* LOADER */
        #mainLoader { width: 50px; height: 50px; border: 4px solid #eee; border-top: 4px solid var(--gold); border-radius: 50%; animation: spin 1s linear infinite; margin: 100px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="hero">
    <h1>Member Directory</h1>
    <p>Discover and verify all educational institutions and professional faculty registered under NAPPS Ogun State.</p>
    <div class="search-container">
        <i class="fas fa-search"></i>
        <input type="text" id="directorySearch" placeholder="Search by name, local government, or subject...">
    </div>
</div>

<div class="status-trigger-wrap">
    <button class="btn-track" onclick="toggleModal(true)">
        <i class="fas fa-certificate"></i> TRACK STATUS & PRINT CERTIFICATE
    </button>
</div>

<div class="container">
    <div id="mainLoader"></div>

    <div class="section-header">
        <h2>Verified Institutions</h2>
        <span class="counter" id="schoolCount">0 TOTAL</span>
    </div>
    <div id="schoolsGrid" class="grid"></div>

    <div class="section-header" style="margin-top: 100px;">
        <h2>Certified Faculty</h2>
        <span class="counter" id="teacherCount">0 TOTAL</span>
    </div>
    <div id="teachersGrid" class="grid"></div>
</div>

<div id="modalOverlay">
    <div class="modal-card">
        <button class="close-btn" onclick="toggleModal(false)">&times;</button>
        <h2 style="font-family:'Cormorant Garamond'; font-size: 2rem;">Verification Portal</h2>
        <p style="font-size: 0.8rem; color: #777;">Enter your registered phone number to access your status and official documents.</p>
        
        <input type="text" id="trackPhone" class="modal-input" placeholder="080XXXXXXXX">
        <button onclick="checkStatus()" id="searchBtn" class="btn-contact" style="border-radius: 8px;">VERIFY IDENTITY</button>
        
        <div id="statusResult"></div>
    </div>
</div>

<script>
    const API_URL = '/.netlify/functions/api';
    let cache = { schools: [], teachers: [] };

    // 1. INITIALIZE DATA
    async function init() {
        try {
            const [sRes, tRes] = await Promise.all([
                fetch(`${API_URL}?type=schools`),
                fetch(`${API_URL}?type=teachers`)
            ]);
            cache.schools = await sRes.json();
            cache.teachers = await tRes.json();
            
            document.getElementById('mainLoader').style.display = 'none';
            render(
                cache.schools.filter(s => s.status === 'verified'),
                cache.teachers.filter(t => t.status === 'verified')
            );
        } catch (e) { console.error("Data Fetch Error:", e); }
    }

    // 2. RENDER ENGINE
    function render(schools, teachers) {
        const sGrid = document.getElementById('schoolsGrid');
        const tGrid = document.getElementById('teachersGrid');
        
        document.getElementById('schoolCount').innerText = `${schools.length} VERIFIED`;
        document.getElementById('teacherCount').innerText = `${teachers.length} CERTIFIED`;

        sGrid.innerHTML = schools.map((item, i) => createCard(item, 'school', i)).join('');
        tGrid.innerHTML = teachers.map((item, i) => createCard(item, 'teacher', i)).join('');

        setTimeout(() => {
            document.querySelectorAll('.card').forEach(c => c.classList.add('reveal'));
        }, 100);
    }

    function createCard(item, type, index) {
        const title = item.school || item.name;
        const sub = item.location || item.subject;
        const icon = type === 'school' ? 'fa-location-dot' : 'fa-graduation-cap';
        const contact = type === 'school' ? `tel:${item.phone}` : `mailto:registry@nappsogun.com`;

        return `
            <div class="card">
                <div class="card-img">
                    <span class="badge"><i class="fas fa-check-circle"></i> VERIFIED MEMBER</span>
                    <img src="${item.image || 'https://via.placeholder.com/450x250'}" alt="Registry Photo">
                </div>
                <div class="card-body">
                    <div class="meta-info"><i class="fas ${icon}"></i> ${sub}</div>
                    <h3>${title}</h3>
                    <p>Official registered member of NAPPS Ogun State. This record has been verified by the State Executive Council for the current academic session.</p>
                </div>
                <a href="${contact}" class="btn-contact">CONTACT ${type === 'school' ? 'OFFICE' : 'EDUCATOR'}</a>
            </div>
        `;
    }

    // 3. SEARCH LOGIC
    document.getElementById('directorySearch').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        const filteredSchools = cache.schools.filter(s => 
            s.status === 'verified' && (s.school.toLowerCase().includes(query) || s.location.toLowerCase().includes(query))
        );
        const filteredTeachers = cache.teachers.filter(t => 
            t.status === 'verified' && (t.name.toLowerCase().includes(query) || t.subject.toLowerCase().includes(query))
        );
        render(filteredSchools, filteredTeachers);
    });

    // 4. MODAL & STATUS CHECKER
    function toggleModal(show) {
        document.getElementById('modalOverlay').style.display = show ? 'flex' : 'none';
        if(!show) document.getElementById('statusResult').style.display = 'none';
    }

    async function checkStatus() {
        const phone = document.getElementById('trackPhone').value.trim();
        const out = document.getElementById('statusResult');
        if(!phone) return;

        const record = [...cache.schools, ...cache.teachers].find(r => r.phone === phone);
        out.style.display = 'block';

        if(record) {
            const isV = record.status === 'verified';
            out.innerHTML = `
                <div style="font-size:2.5rem; margin-bottom:10px;">${isV ? '📜' : '⏳'}</div>
                <h4 style="font-family:'Cormorant Garamond'; font-size:1.5rem;">${record.school || record.name}</h4>
                <p style="font-size:0.75rem; font-weight:800; color:${isV ? '#166534' : '#92400e'}">STATUS: ${record.status.toUpperCase()}</p>
                ${isV ? `<button onclick="downloadCert('${record.school || record.name}', '${record.id}')" style="margin-top:15px; background:var(--gold); border:none; padding:10px 20px; font-weight:bold; cursor:pointer; border-radius:4px; font-size:0.7rem; width:100%;">PRINT OFFICIAL CERTIFICATE</button>` : `<p style="font-size:0.65rem; color:#888; margin-top:10px;">Verification usually takes 24-48 hours after receipt upload.</p>`}
            `;
        } else {
            out.innerHTML = `<p style="color:#be123c; font-weight:bold;">Record Not Found</p>`;
        }
    }

    // 5. CERTIFICATE GENERATOR
    function downloadCert(name, id) {
        const win = window.open('', '_blank');
        const date = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
        win.document.write(`
            <html><body style="margin:0; display:flex; justify-content:center; align-items:center; height:100vh; font-family:sans-serif; background:#eee;">
                <div style="width:800px; height:550px; padding:20px; background:#d4af37; box-shadow:0 0 50px rgba(0,0,0,0.2);">
                    <div style="background:white; height:100%; border:5px double #062117; display:flex; flex-direction:column; align-items:center; text-align:center; padding:50px; box-sizing:border-box;">
                        <h2 style="color:#062117; margin:0;">NAPPS OGUN STATE</h2>
                        <p style="letter-spacing:3px; font-size:0.6rem; color:#d4af37; font-weight:bold;">MEMBER DIRECTORY VERIFICATION</p>
                        <h1 style="font-family:serif; font-size:3rem; margin:30px 0;">Certificate of Registry</h1>
                        <p>This is to certify that</p>
                        <h2 style="font-family:serif; font-size:2rem; color:#d4af37; text-decoration:underline;">${name.toUpperCase()}</h2>
                        <p>is a verified member for the 2026 academic session.</p>
                        <div style="margin-top:auto; width:100%; display:flex; justify-content:space-between; font-size:0.7rem;">
                            <div><b>ID:</b> ${id}</div>
                            <div><b>DATE:</b> ${date}</div>
                        </div>
                    </div>
                </div>
                <script>setTimeout(() => { window.print(); window.close(); }, 500);<\/script>
            </body></html>
        `);
    }

    init();
</script>
</body>
</html>
